<!doctype html>
<html lang="en-NZ">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" sizes="48x48" href="./favicon.ico" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Study notes and worked figures for NCEA Level 2 Mathematics."
    />
    <title>NCEA Level 2 Maths</title>
    <script>
      /* A chosen colour scheme is applied here, before anything is painted, so
         that the page never appears in the other one first. The name of the key
         and of the attribute belong to src/colour-scheme.ts. */
      var scheme = localStorage.getItem('colour-scheme')
      if (scheme) document.documentElement.dataset.scheme = scheme
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
